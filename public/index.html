<!doctype html>
<html lang="da" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>99 LUCIANO</title>
  <meta name="description" content="99 LUCIANO, kunstner. En del af 99.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="99 LUCIANO">
  <meta property="og:description" content="Kunstner. En del af 99.">
  <meta property="og:image" content="assets/og.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=dev">
</head>
<body>
  <main class="vote">
    <section class="folio">
      <img class="folio__mark" src="assets/mark.png" alt="99" width="959" height="882">
      <h1 class="folio__word">LUCIANO</h1>
      <nav class="apps" aria-label="Find mig her"></nav>
      <!-- Shown while a vote is running -->
      <a class="folio__cta" id="vote-cta" href="vote/" hidden>
        <strong>Stem på min næste single</strong>
        <span id="vote-prize">og vind et gavekort på 150 kr.</span>
      </a>
    </section>
  </main>

  <footer class="footer">
    <img src="assets/mark-160.png" alt="" width="33" height="30">
    <p>© <span id="year">2026</span> 99 LUCIANO, en del af 99</p>
    <nav class="footer__family" aria-label="Links">
      <span class="footer__socials"></span>
      <a href="https://99management.dk" target="_blank" rel="noopener">99MGMT</a>
    </nav>
  </footer>

  <script src="main.js?v=dev"></script>
  <script src="giveaway/config.js?v=dev"></script>
  <script src="giveaway/socials.js?v=dev"></script>
  <script>
    // Show the vote button while a giveaway with songs is open
    API.status().then(function (s) {
      if (!s.closed && s.unlocked && s.songs && s.songs.length) {
        // "Gavekort på 150 kr. til hvad du vil" → "og vind et gavekort på 150 kr."
        var m = String(s.prize || '').match(/(\d[\d.,]*)\s*(kr\.?|kroner|dkk)/i);
        var gift = /gavekort/i.test(s.prize || '');
        document.getElementById('vote-prize').textContent = m
          ? 'og vind ' + (gift ? 'et gavekort' : 'en præmie') + ' på ' + m[1] + ' kr.'
          : (s.prize ? 'og vind ' + s.prize.charAt(0).toLowerCase() + s.prize.slice(1) : 'og vind en præmie');
        document.getElementById('vote-cta').hidden = false;
      }
    }, function () {});
  </script>
</body>
</html>
